spring.application.name=library-webservice
server.address=127.0.0.1
server.port=${PORT:8080}
library.database.path=${LIBRARY_DB_PATH:library.db}
library.session.minutes=60
spring.sql.init.mode=never
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-null-for-primitives=true
spring.jackson.deserialization.accept-float-as-int=false
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=16KB
